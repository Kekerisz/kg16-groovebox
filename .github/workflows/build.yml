name: Build installers

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  KG16_VERSION: "1.0.0"

jobs:
  mac:
    name: macOS (VST3 + AU, Intel + Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target KG16_VST3 KG16_AU KG16_Standalone -j 4

      - name: Sign (ad-hoc) and package
        run: |
          set -e
          A="build/KG16_artefacts/Release"
          for b in "$A/VST3/KG-16 Groovebox.vst3" "$A/AU/KG-16 Groovebox.component" "$A/Standalone/KG-16 Groovebox.app"; do
            codesign --force --deep --sign - "$b"
          done
          mkdir -p root/Library/Audio/Plug-Ins/VST3 root/Library/Audio/Plug-Ins/Components root/Applications
          cp -R "$A/VST3/KG-16 Groovebox.vst3" root/Library/Audio/Plug-Ins/VST3/
          cp -R "$A/AU/KG-16 Groovebox.component" root/Library/Audio/Plug-Ins/Components/
          cp -R "$A/Standalone/KG-16 Groovebox.app" root/Applications/
          chmod +x installer/mac/postinstall
          pkgbuild --root root --identifier media.kevingal.kg16 --version "$KG16_VERSION" \
                   --scripts installer/mac --install-location / "KG16-Groovebox-Mac.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: KG16-Groovebox-Mac
          path: KG16-Groovebox-Mac.pkg

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: WebView2 SDK (the plugin window uses Edge WebView2)
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:GITHUB_WORKSPACE\nuget"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE\nuget"

      - name: Build
        run: cmake --build build --config Release --target KG16_VST3 KG16_Standalone -j 4

      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KG16-Groovebox-Windows
          path: installer\Output\KG16-Groovebox-Windows-Setup.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KG16-Groovebox-Mac/KG16-Groovebox-Mac.pkg
            dist/KG16-Groovebox-Windows/KG16-Groovebox-Windows-Setup.exe
